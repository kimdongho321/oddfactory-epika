plugins { id 'com.android.application' }
android {
 namespace 'com.oddfactory.epica'
 compileSdk 35
 defaultConfig { applicationId 'com.oddfactory.epica'; minSdk 30; targetSdk 35; versionCode 31; versionName '1.7.4' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets.main.assets.setSrcDirs([file('src/main/assets')])
 buildTypes { release { debuggable false; crunchPngs false; minifyEnabled true; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
 lint { abortOnError true;checkReleaseBuilds true }
 
 androidResources { noCompress 'png' }
}

